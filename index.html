<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3_2k</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'HoshikoSatsuki';
            src: url('HoshikoSatsuki.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .section {
            min-height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.3) blur(2px);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 100%);
            z-index: -1;
        }

        /* Section 1 — Profile */
        .profile-section {
            flex-direction: column;
            gap: 24px;
        }

        .pfp-container {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .pfp-glow {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 192px;
            height: 192px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #000, #333, #000, #333, #000);
            animation: rotate 3s linear infinite;
            filter: blur(10px);
            opacity: 0.8;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .pfp {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(0,0,0,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.6), 0 0 40px rgba(0,0,0,0.3);
            z-index: 1;
        }

        .pfp img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-family: 'HoshikoSatsuki', 'Inter', sans-serif;
            font-size: 64px;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.6), 0 0 60px rgba(0,0,0,0.4);
            text-align: center;
        }

        .tagline {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounce 2s ease infinite;
        }

        .scroll-indicator span {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .scroll-arrow {
            width: 20px;
            height: 20px;
            border-right: 2px solid rgba(255,255,255,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            transform: rotate(45deg);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* Section 2 — Music Player */
        .music-section {
            flex-direction: column;
            gap: 30px;
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px;
            width: 420px;
            max-width: 90vw;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .player-art {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #666);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }

        .player-now-playing {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .player-now-playing::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #555, #888);
            border-radius: 4px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            font-family: 'JetBrains Mono', monospace;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            padding: 8px;
        }

        .ctrl-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .volume-icon {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            transition: color 0.2s;
        }

        .volume-icon:hover {
            color: #fff;
        }

        .volume-slider-wrap {
            width: 0;
            overflow: hidden;
            transition: width 0.25s ease;
        }

        .volume-wrapper:hover .volume-slider-wrap {
            width: 100px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            margin-left: 4px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        /* Section 3 — Skills */
        .skills-section {
            flex-direction: column;
            gap: 40px;
            padding: 60px 20px;
        }

        .skills-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 48px;
            width: 600px;
            max-width: 90vw;
        }

        .skills-heading {
            font-family: 'HoshikoSatsuki', 'Inter', sans-serif;
            font-size: 40px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        .skills-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 36px;
        }

        .skill-category {
            margin-bottom: 28px;
        }

        .skill-category:last-child {
            margin-bottom: 0;
        }

        .skill-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            transition: all 0.2s;
        }

        .skill-tag:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
            color: rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }

        .skill-tag.highlight {
            background: rgba(255,255,255,0.08);
            border-color: rgba(139,92,246,0.3);
            color: #c4b5fd;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 24px 0;
        }

        .mc-section {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .mc-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: linear-gradient(135deg, #555, #777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .mc-info {
            flex: 1;
        }

        .mc-title {
            font-size: 16px;
            font-weight: 700;
        }

        .mc-ign {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }

        .mc-ign span {
            color: #aaa;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .mc-badge {
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation dots */
        .nav-dots {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .nav-dot.active {
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.3);
        }

        .nav-dot:hover {
            background: rgba(255,255,255,0.5);
        }

        /* Entrance animations */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s ease forwards;
        }

        .fade-up.d1 { animation-delay: 0.1s; }
        .fade-up.d2 { animation-delay: 0.2s; }
        .fade-up.d3 { animation-delay: 0.3s; }
        .fade-up.d4 { animation-delay: 0.4s; }
        .fade-up.d5 { animation-delay: 0.5s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Section 4 — Guestbook */
        .guestbook-section {
            flex-direction: column;
            gap: 24px;
            padding: 60px 20px;
        }
        .guestbook-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 32px;
            width: 640px;
            max-width: 90vw;
        }
        .guestbook-heading {
            font-family: 'HoshikoSatsuki', 'Inter', sans-serif;
            font-size: 36px;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
            margin-bottom: 6px;
        }
        .guestbook-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .guestbook-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .gb-input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .gb-input::placeholder { color: rgba(255,255,255,0.3); }
        .gb-input:focus { border-color: rgba(255,255,255,0.2); }
        .gb-input.name { width: 140px; flex-shrink: 0; }
        .gb-input.msg { flex: 1; min-width: 160px; }
        .gb-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .gb-btn:hover { transform: scale(1.04); }
        .gb-btn:active { transform: scale(0.97); }
        .gb-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            min-height: 16px;
        }
        .gb-error {
            font-size: 12px;
            color: #ff6b6b;
            font-weight: 500;
        }
        .gb-count {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-family: 'JetBrains Mono', monospace;
        }
        .guestbook-wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .guestbook-wall::-webkit-scrollbar { width: 4px; }
        .guestbook-wall::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .guestbook-wall:empty::after {
            content: 'no notes yet — be first';
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .gb-note {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 12px 14px;
            animation: fadeUp 0.3s ease;
            word-break: break-word;
        }
        .gb-note-name {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gb-note-msg {
            font-size: 12px;
            color: rgba(255,255,255,0.65);
            line-height: 1.4;
            word-break: break-word;
        }
        .gb-note-time {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .name { font-size: 36px; }
            .pfp-container, .pfp { width: 140px; height: 140px; }
            .pfp-glow { width: 148px; height: 148px; }
            .player-card, .skills-card { padding: 28px; }
            .skills-heading { font-size: 24px; }
            .nav-dots { right: 12px; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg">
        <img src="background.gif" alt="">
    </div>
    <div class="bg-overlay"></div>

    <!-- Navigation dots -->
    <nav class="nav-dots">
        <button class="nav-dot active" onclick="scrollToSection(0)"></button>
        <button class="nav-dot" onclick="scrollToSection(1)"></button>
        <button class="nav-dot" onclick="scrollToSection(2)"></button>
        <button class="nav-dot" onclick="scrollToSection(3)"></button>
    </nav>

    <!-- Section 1 — Profile -->
    <section class="section profile-section" id="sec0">
        <div class="pfp-container fade-up d1">
            <div class="pfp-glow"></div>
            <div class="pfp">
                <img src="pfp.png" alt="3_2k">
            </div>
        </div>
        <div class="name fade-up d2">3_2k</div>
        <div class="tagline fade-up d3">developer</div>
        <div class="scroll-indicator fade-up d4">
            <span>scroll</span>
            <div class="scroll-arrow"></div>
        </div>
    </section>

    <!-- Section 2 — Music Player -->
    <section class="section music-section" id="sec1">
        <div class="player-card fade-up">
            <div class="player-header">
                <div class="player-art"><img src="blushin.png" alt="blushin" style="width:100%;height:100%;object-fit:cover;border-radius:12px;"></div>
                <div class="player-info">
                    <div class="player-now-playing">Now Playing</div>
                    <div class="player-title">blushin</div>
                    <div class="player-artist">xoly</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="ctrl-btn" title="Previous">⏮</button>
                <button class="play-btn" id="playBtn" title="Play">▶</button>
                <button class="ctrl-btn" title="Next">⏭</button>
                <div class="volume-wrapper">
                    <button class="volume-icon" id="volIcon">🔊</button>
                    <div class="volume-slider-wrap">
                        <input type="range" class="volume-slider" id="volSlider" min="0" max="100" value="75">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Section 3 — Skills -->
    <section class="section skills-section" id="sec2">
        <div class="skills-card fade-up">
            <div class="skills-heading">i like coding</div>
            <div class="skills-sub">full-stack developer</div>

            <div class="skill-category">
                <div class="skill-label">Frontend</div>
                <div class="skill-tags">
                    <span class="skill-tag highlight">html</span>
                    <span class="skill-tag highlight">css</span>
                    <span class="skill-tag highlight">javascript</span>
                </div>
            </div>

            <div class="skill-category">
                <div class="skill-label">Backend</div>
                <div class="skill-tags">
                    <span class="skill-tag">python</span>
                    <span class="skill-tag">java</span>
                    <span class="skill-tag">c++</span>
                    <span class="skill-tag">node</span>
                </div>
            </div>

            <div class="skill-category">
                <div class="skill-label">Scripting</div>
                <div class="skill-tags">
                    <span class="skill-tag">lua</span>
                    <span class="skill-tag">luau</span>
                </div>
            </div>


        </div>
    </section>

    <!-- Section 4 — Guestbook -->
    <section class="section guestbook-section" id="sec3">
        <div class="guestbook-card fade-up">
            <div class="guestbook-heading">guestbook</div>
            <div class="guestbook-sub">leave a note — 30 chars max</div>
            <div class="guestbook-form">
                <input class="gb-input name" id="gbName" type="text" placeholder="name" maxlength="16" autocomplete="off">
                <input class="gb-input msg" id="gbMsg" type="text" placeholder="your note..." maxlength="30" autocomplete="off">
                <button class="gb-btn" id="gbBtn">post</button>
            </div>
            <div class="gb-meta">
                <span class="gb-error" id="gbError"></span>
                <span class="gb-count" id="gbCount">0 / 30</span>
            </div>
            <div class="guestbook-wall" id="gbWall"></div>
        </div>
    </section>

    <script>
        // Audio Player
        const audio = new Audio('blushin.mp3');
        audio.preload = 'auto';
        audio.loop = true;
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        let isPlaying = false;
        let hasInteracted = false;

        function startPlayback() {
            if (hasInteracted) return;
            hasInteracted = true;
            audio.play().then(() => {
                playBtn.textContent = '⏸';
                isPlaying = true;
            }).catch(() => {});
        }

        // Try auto-play on load
        window.addEventListener('load', () => {
            audio.play().then(() => {
                playBtn.textContent = '⏸';
                isPlaying = true;
                hasInteracted = true;
            }).catch(() => {});
        });

        // Fallback: play on first user interaction
        document.addEventListener('click', startPlayback, { once: true });
        document.addEventListener('keydown', startPlayback, { once: true });

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
            } else {
                audio.play();
                playBtn.textContent = '⏸';
                isPlaying = true;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶';
            isPlaying = false;
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });

        progressBar.addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = progressBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const pct = x / rect.width;
                audio.currentTime = pct * audio.duration;
            }
        });

        // Volume
        const volSlider = document.getElementById('volSlider');
        const volIcon = document.getElementById('volIcon');

        function applyVolume(val) {
            const curved = (val / 100) ** 1.5;
            audio.volume = Math.max(0, Math.min(1, curved));
            volIcon.textContent = val === 0 ? '🔇' : val < 50 ? '🔉' : '🔊';
        }

        volSlider.addEventListener('input', () => {
            applyVolume(parseInt(volSlider.value));
        });

        audio.volume = 0.75;

        // Guestbook — shared via Firebase (free, no payment) + n-word filter + duplicate names + 30 char limit
        const GB_KEY = '3_2k_guestbook';
        const FIREBASE_URL = 'https://k-3b9c0-default-rtdb.firebaseio.com/notes.json';
        const REMOTE_URL = FIREBASE_URL;
        const gbName = document.getElementById('gbName');
        const gbMsg = document.getElementById('gbMsg');
        const gbBtn = document.getElementById('gbBtn');
        const gbWall = document.getElementById('gbWall');
        const gbError = document.getElementById('gbError');
        const gbCount = document.getElementById('gbCount');

        // censor only n-word variants (hard r / a) — case-insensitive, leet-ish
        function censor(text) {
            return text.replace(/n+[i1!|]+g{2,}[a4@e3]*r*s*/gi, m => '*'.repeat(m.length));
        }
        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        async function fetchRemoteNotes() {
            // if Firebase not configured yet, skip remote
            if (!FIREBASE_URL || FIREBASE_URL.includes('REPLACE_WITH')) return null;
            try {
                const r = await fetch(FIREBASE_URL);
                if (!r.ok) return null;
                const raw = await r.json();
                // Firebase returns object { "-Nxxx": {name,msg,time}, ... } or null
                const data = raw ? Object.values(raw) : [];
                try { localStorage.setItem(GB_KEY, JSON.stringify(data)); } catch(e){}
                return data;
            } catch(e) { return null; }
        }
        async function loadNotes() {
            const remote = await fetchRemoteNotes();
            if (remote !== null) return remote;
            try { return JSON.parse(localStorage.getItem(GB_KEY) || '[]'); } catch(e){ return []; }
        }
        async function renderWall() {
            gbWall.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;font-size:11px;color:rgba(255,255,255,0.3);">loading...</div>';
            const notes = await loadNotes();
            gbWall.innerHTML = '';
            if (notes.length === 0) return;
            [...notes].reverse().forEach(n => {
                const div = document.createElement('div');
                div.className = 'gb-note';
                const time = n.time ? new Date(n.time).toLocaleDateString() : '';
                div.innerHTML = `<div class="gb-note-name">${escapeHtml(n.name)}</div><div class="gb-note-msg">${escapeHtml(n.msg)}</div><div class="gb-note-time">${escapeHtml(time)}</div>`;
                gbWall.appendChild(div);
            });
        }
        function updateCount() {
            const len = gbMsg.value.length;
            gbCount.textContent = len + ' / 30';
            gbCount.style.color = len >= 30 ? '#ff6b6b' : len > 24 ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
        }
        gbMsg.addEventListener('input', updateCount);

        async function tryPost() {
            gbError.textContent = '';
            let name = gbName.value.trim();
            let msg = gbMsg.value.trim();
            if (!name) { gbError.textContent = 'enter a name'; return; }
            if (name.length > 16) { gbError.textContent = 'name max 16 chars'; return; }
            if (!msg) { gbError.textContent = 'enter a note'; return; }
            if (msg.length > 30) { gbError.textContent = '30 chars max'; return; }
            gbBtn.disabled = true;
            gbBtn.textContent = '...';
            const notes = await loadNotes();
            if (notes.some(n => n.name.toLowerCase() === name.toLowerCase())) {
                gbError.textContent = 'name already taken';
                gbBtn.disabled = false;
                gbBtn.textContent = 'post';
                return;
            }
            name = censor(name);
            msg = censor(msg);
            if (msg.length > 30) msg = msg.slice(0,30);
            const payload = { name, msg, time: Date.now() };
            // if Firebase not configured, use localStorage only (so you can test before Firebase is ready)
            const useRemote = FIREBASE_URL && !FIREBASE_URL.includes('REPLACE_WITH');
            if (useRemote) {
                try {
                    const res = await fetch(FIREBASE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error('remote failed');
                } catch(e) {
                    gbError.textContent = 'failed to post — check Firebase URL/rules';
                    gbBtn.disabled = false;
                    gbBtn.textContent = 'post';
                    return;
                }
            } else {
                // local fallback until Firebase is added
                const newNotes = [...notes, payload];
                try { localStorage.setItem(GB_KEY, JSON.stringify(newNotes)); } catch(e){}
            }
            gbMsg.value = '';
            updateCount();
            await renderWall();
            gbError.style.color = '#aaa';
            gbError.textContent = 'posted';
            gbBtn.disabled = false;
            gbBtn.textContent = 'post';
            setTimeout(() => { gbError.textContent = ''; gbError.style.color = '#ff6b6b'; }, 1500);
        }
        gbBtn.addEventListener('click', tryPost);
        gbMsg.addEventListener('keydown', e => { if (e.key === 'Enter') tryPost(); });
        gbName.addEventListener('keydown', e => { if (e.key === 'Enter') gbMsg.focus(); });
        renderWall();
        updateCount();

        // Nav dots
        const sections = document.querySelectorAll('.section');
        const dots = document.querySelectorAll('.nav-dot');

        function scrollToSection(i) {
            sections[i].scrollIntoView({ behavior: 'smooth' });
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const idx = Array.from(sections).indexOf(entry.target);
                    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
                }
            });
        }, { threshold: 0.5 });

        sections.forEach(s => observer.observe(s));

        // Animate elements on scroll
        const fadeEls = document.querySelectorAll('.fade-up');
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, { threshold: 0.1 });

        fadeEls.forEach(el => {
            el.style.animationPlayState = 'paused';
            fadeObserver.observe(el);
        });
    </script>
</body>
</html>
